<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bucket-List-Motivator</title>
  <link rel="stylesheet" href="./styles/styles.css" />
  <script src="./src/script.js" defer></script>
</head>

<body>
  <!-- Navigation -->
  <section class="nav-container">
    <div>
      <a href="./index.html" class="button">HOME</a>
    </div>
    <div>
      <a href="./bucket-list.html" class="button">My Bucket List</a>
    </div>
    <div>
      <a href="./about.html" class="button">ABOUT</a>
    </div>
  </section>

  <!-- Home Section -->
  <section id="home" class="home-section">
    <h1>Welcome to Bucket-List-Motivator</h1>
    <p>Get inspired to complete your bucket list with motivational quotes and track your progress!</p>
  </section>

  <!-- Bucket List Section -->
  <section id="bucket-list" class="bucket-list-section">
    <h1>My Bucket List</h1>

    <!-- Input Field -->
    <section class="input-section">
      <input type="text" id="new-task" placeholder="Add a new task..." class="task-input" />
      <button id="show-completed-btn">Show Completed</button>
      <button class="add-task-btn">Add Task</button>
    </section>

    <!-- Task List -->
    <section class="tasks-section">
      <ul id="task-list" class="task-list"></ul>

      <!-- Motivational Quote Display -->
      <div id="quote-display" class="quote-display"></div>

      <!-- Task Control Buttons -->
      <div class="task-controls">
        <button id="show-completed-btn" class="control-btn">Show Completed Tasks</button>
        <button id="clear-all-btn" class="control-btn">Clear All Tasks</button>
      </div>
    </section>
  </section>
</body>

</html>
